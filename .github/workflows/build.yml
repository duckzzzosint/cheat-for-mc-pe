name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5 wrapper
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew" \
            -o gradlew
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Setup Android SDK + NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          NDK="$SDK/ndk/26.3.11579264"
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK"         >> $GITHUB_ENV

      # Pre-clone C++ deps BEFORE Gradle runs so FetchContent finds local dirs
      - name: Pre-clone ImGui
        run: |
          git clone --depth=1 --branch v1.90.4 \
            https://github.com/ocornut/imgui.git \
            $GITHUB_WORKSPACE/deps/imgui
          echo "IMGUI_SRC=$GITHUB_WORKSPACE/deps/imgui" >> $GITHUB_ENV

      - name: Pre-clone Dobby
        run: |
          git clone --depth=1 \
            https://github.com/jmpews/Dobby.git \
            $GITHUB_WORKSPACE/deps/dobby
          echo "DOBBY_SRC=$GITHUB_WORKSPACE/deps/dobby" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt','**/*.gradle') }}
          restore-keys: build-${{ runner.os }}-

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME"     > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PimguiSrc="$IMGUI_SRC" \
            -PdobbySrc="$DOBBY_SRC"
        env:
          ANDROID_HOME:     ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          IMGUI_SRC:        ${{ env.IMGUI_SRC }}
          DOBBY_SRC:        ${{ env.DOBBY_SRC }}

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mc-cheat-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
