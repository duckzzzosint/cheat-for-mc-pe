plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toker.mccheat'
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.toker.mccheat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -fvisibility=hidden -fno-rtti"

                def imgui = project.findProperty('imguiSrc') ?: ''
                def dobby  = project.findProperty('dobbySrc') ?: ''

                def args = [
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_PLATFORM=android-26",
                    "-DFETCHCONTENT_QUIET=OFF"
                ]
                if (imgui) args << "-DIMGUI_DIR=${imgui}"
                if (dobby)  args << "-DFETCHCONTENT_SOURCE_DIR_DOBBY=${dobby}"

                arguments args.toArray(new String[0])
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
        }
    }

    buildTypes {
        debug {
            debuggable    true
            minifyEnabled false
        }
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    sourceSets {
        main {
            assets.srcDirs  = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
