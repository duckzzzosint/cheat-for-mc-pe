plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toker.mccheat'
    ndkVersion "26.3.11579264"
    compileSdk 34

    defaultConfig {
        applicationId "com.toker.mccheat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -fvisibility=hidden -fno-rtti"

                // Read pre-cloned dependency paths passed via -P from CLI
                def imgui = project.findProperty('imguiSrc') ?: ''
                def dobby  = project.findProperty('dobbySrc') ?: ''

                def cmakeArgs = [
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_PLATFORM=android-26",
                    "-DFETCHCONTENT_QUIET=OFF",
                    "-DCMAKE_BUILD_TYPE=Debug"
                ]
                // If pre-cloned dirs exist, tell FetchContent to use them (no download)
                if (imgui) cmakeArgs << "-DFETCHCONTENT_SOURCE_DIR_IMGUI=${imgui}"
                if (dobby)  cmakeArgs << "-DFETCHCONTENT_SOURCE_DIR_DOBBY=${dobby}"

                arguments(*cmakeArgs)
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            // no version — use system cmake (ubuntu-22.04 has 3.22+)
        }
    }

    buildTypes {
        debug {
            debuggable    true
            minifyEnabled false
        }
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            assets.srcDirs  = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
